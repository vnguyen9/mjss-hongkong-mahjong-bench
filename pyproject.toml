[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hkbench"
version = "1.0.0"
description = "The Hong Kong Mahjong Bench: a rules engine, scorer and harness for comparing Hong Kong Mahjong players."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
hkbench = "hkbench.cli:main"

[tool.setuptools.packages.find]
include = ["hkbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
